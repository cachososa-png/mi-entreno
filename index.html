<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Entreno</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--ac:#0f766e;--ac2:#e3f3f1;--bd:#e1e4e8;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff2;--mu:#98a2ad;--ac:#2dd4bf;--ac2:#13302e;--bd:#2c333b;--on:#06201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff2;--mu:#98a2ad;--ac:#2dd4bf;--ac2:#13302e;--bd:#2c333b;--on:#06201d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--on);font-weight:600}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--mu);padding:4px 8px;font-weight:400}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row .n{width:52px;color:var(--mu);font-size:13px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.row input{width:72px;text-align:center}
.chk{width:44px;height:40px;padding:0;background:var(--ac2);color:var(--mu);font-size:20px}
.chk.on{background:var(--ac);color:var(--on)}
textarea{min-height:170px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 0}nav button.on{color:var(--ac)}
.full{width:100%;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--ac2);color:var(--ac);padding:8px 14px}.chip.on{background:var(--ac);color:var(--on)}
.wk{display:flex;align-items:center;gap:10px;justify-content:space-between}.wk button{padding:8px 16px}
.rest{position:fixed;left:8px;right:8px;max-width:624px;margin:0 auto;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:8px;font-weight:700}.rest span{flex:1}.rest button{background:var(--on);color:var(--ac);padding:6px 10px}
.demo{margin-top:8px}.imgs{display:flex;gap:6px}.imgs img{flex:1;min-width:0;width:50%;border-radius:8px;background:#fff}.demo a{display:inline-block;margin-top:8px;color:var(--ac)}.th{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#fff}

/* v3: más grande y amigable */
body{font-size:17px;padding-bottom:100px}main{padding:16px}h1{font-size:26px}h2{font-size:18px}
button{min-height:52px;border-radius:16px;font-size:17px;touch-action:manipulation}
.card{border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.full{min-height:58px;font-size:18px;margin-top:10px}
.row{gap:6px}.row input{height:56px;font-size:22px;font-weight:700;border-radius:14px;width:64px;padding:4px}.row input.rp{width:56px}
.chk{width:56px;height:56px;min-height:56px;border-radius:50%;font-size:26px;flex:none;padding:0}
.stp{width:44px;height:56px;min-height:56px;padding:0;font-size:28px;background:var(--ac2);color:var(--ac);border-radius:14px;flex:none}
.sn{width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.chip{min-height:48px;border-radius:24px;padding:10px 18px}
.wk button{width:56px;padding:0}
.th{width:64px;height:64px}
select{height:52px;font-size:17px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;min-height:66px;padding:8px 0}nav button b{font-size:24px;font-weight:400}
.rest{bottom:calc(78px + env(safe-area-inset-bottom,0px));font-size:18px}.rest button{min-height:44px}
.pbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}.pbar .tr{height:14px;border-radius:7px;background:var(--ac2);overflow:hidden}.pbar .tr div{height:100%;background:var(--ac);transition:width .3s}
.tiles{display:flex;gap:8px;margin-bottom:10px}.tile{flex:1;text-align:center;padding:12px 4px;margin:0}.tile b{display:block;font-size:26px}
.hero{background:var(--ac);color:var(--on);border-radius:22px;padding:20px;margin-bottom:12px}.big{font-size:52px}

/* v4: pantalla principal con 4 menús grandes */
nav{display:none}.rest{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile4{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:176px;border-radius:24px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-bottom:6px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:400;padding:12px 6px}
.tile4 .ic{font-size:54px;line-height:1}.tile4 b{font-size:21px}.tile4 .sub{font-size:13px;color:var(--mu)}
.hero2{width:100%;text-align:left;background:var(--ac);color:var(--on);border-radius:22px;padding:16px;margin-bottom:12px;display:block}.hero2 b{font-size:22px;display:block;margin:2px 0}

/* v5: peso semanal */
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);padding:16px;overflow:auto}
.wr{display:flex;align-items:center;gap:10px;margin-top:8px}.wr img{width:44px;height:44px;border-radius:8px;object-fit:cover}

/* v11: animaciones y frases */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:14px 20px;border-radius:16px;font-weight:700;z-index:60;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .35s ease-out,tout .4s ease-in 2.4s forwards}
.toast.gold{background:#f59e0b;color:#1b1f24}
@keyframes tin{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tout{to{opacity:0;transform:translate(-50%,-20px)}}
.cf{position:fixed;top:-30px;z-index:59;pointer-events:none;animation:cfall 2.4s ease-in forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.chk.on{animation:pop .3s}
.wmsg{border-radius:14px;padding:12px;margin-top:10px;font-size:15px}
.wmsg.good{background:var(--ac2)}.wmsg.attn,.wmsg.warn{background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.55)}
@media (prefers-reduced-motion:reduce){.cf{display:none}.chk.on{animation:none}}
.phcard{width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:0 0 12px;font-weight:500;font-size:16px;line-height:1.4;min-height:56px;display:block}

/* v14: transiciones, bienvenida animada y pop-up */
input[type=date]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;height:56px}
#app.pg>*{animation:pgIn .34s cubic-bezier(.2,.8,.2,1) both}
#app.pg.bk>*{animation-name:pgBk}
#app.pg>*:nth-child(2){animation-delay:.05s}#app.pg>*:nth-child(3){animation-delay:.1s}#app.pg>*:nth-child(4){animation-delay:.15s}#app.pg>*:nth-child(5){animation-delay:.2s}#app.pg>*:nth-child(n+6){animation-delay:.25s}
@keyframes pgIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pgBk{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
#app.pg .grid4 .tile4{animation:tilePop .5s cubic-bezier(.34,1.56,.64,1) both}
#app.pg .grid4 .tile4:nth-child(2){animation-delay:.07s}#app.pg .grid4 .tile4:nth-child(3){animation-delay:.14s}#app.pg .grid4 .tile4:nth-child(4){animation-delay:.21s}
@keyframes tilePop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
button:active{transform:scale(.97);transition:transform .08s}.tile4:active{transform:scale(.95)}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,var(--ac) 0,#0b2a33 90%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-ic{font-size:84px;position:relative;animation:spBounce 1s cubic-bezier(.34,1.56,.64,1) both}
.sp-ic:before{content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid rgba(255,255,255,.45);animation:spRing 1.8s ease-out infinite}
.sp-t{font-size:32px;font-weight:800;margin-top:18px;animation:spUp .7s .35s both}
.sp-s{font-size:18px;opacity:.92;margin-top:8px;animation:spUp .7s .75s both}
.sp-bar{width:140px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:28px;overflow:hidden}.sp-bar i{display:block;height:100%;background:#fff;animation:spBar 2.2s linear both}
@keyframes spBounce{from{opacity:0;transform:scale(.3) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spRing{from{transform:scale(.5);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes spBar{from{width:0}to{width:100%}}
.pop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s both}
.pop .pc{background:var(--card);color:var(--tx);border-radius:26px;padding:26px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both}
.pop .pe{font-size:64px;line-height:1}.pop .pt{font-size:24px;font-weight:800;margin-top:10px}.pop .pp{font-size:19px;margin-top:10px;line-height:1.35}.pop .pm{margin-top:10px}
.pop.out{animation:fadeOut .25s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app.pg>*,#app.pg .grid4 .tile4,.sp-ic,.sp-ic:before,.sp-t,.sp-s,.pop .pc{animation:none!important}}

/* v15: logros, resumen y ajustes de sonido */
.row input[type=checkbox]{width:30px;height:30px;min-height:0;accent-color:var(--ac);flex:none}
.pop .pp{white-space:pre-line}.pop .pc{max-height:88vh;overflow:auto}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bg{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center;opacity:.45;filter:grayscale(1)}
.bg.on{opacity:1;filter:none;border-color:var(--ac);background:var(--ac2)}
.bi{font-size:30px}.bt{font-size:12px;line-height:1.2;min-height:30px}.bp{font-size:12px;color:var(--mu)}

/* v16: seguimiento, fotos, temporizadores */
.rest.tm{bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#0ea5e9}
.thumb{padding:0;min-height:0;aspect-ratio:3/4;background:var(--bg);border-radius:12px;overflow:hidden;border:1px solid var(--bd);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 0}
.hb{height:12px;border-radius:6px;background:var(--ac2);overflow:hidden}.hb i{display:block;height:100%;background:var(--ac);transition:width .4s}
.dayb{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.dayb i{display:block;width:70%;border-radius:6px 6px 0 0;background:var(--ac);min-height:3px}
.qrb{background:#fff;padding:10px;border-radius:14px;display:inline-block;box-sizing:border-box}.qrb svg{width:100%;height:100%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cd{aspect-ratio:1;min-height:0;padding:0;border-radius:10px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cal .cd i{font-style:normal;font-size:9px;line-height:1;letter-spacing:-1px}
.cal .cd.on{background:var(--ac2);border-color:var(--ac)}.cal .cd.hoy{outline:2px solid var(--ac)}
#app,.modal>*,.pop .pc{zoom:var(--z,1)}
#cd-cv{max-height:58vh;width:auto;max-width:100%;display:block;margin:10px auto 0;border-radius:14px}
</style></head><body><main id="app"></main>
<div id="rest" class="rest"></div>
<div id="tmr" class="rest tm"></div>
<nav id="nav"></nav>
<div id="splash"><div class="sp-ic" id="sp-ic">🏋️</div><div class="sp-t" id="sp-t">Bienvenido</div><div class="sp-s" id="sp-s">Comencemos el entrenamiento</div><div class="sp-bar"><i></i></div></div>

function parse(t){
  const ss=[];let cur=null,prev='';
  for(const raw of t.split('\n')){
    const l=raw.replace(/\s+/g,' ').trim();if(!l)continue;
    let m=l.match(/^([A-Z])\s*\|\s*(.+)$/)||l.match(/^((?:d[ií]a|sesi[oó]n|rutina)\s+\w+)\b\s*[:\-|]?\s*(.*)$/i);
    if(m){const name=(m[1]+' · '+m[2]).replace(/ · $/,'');
      cur=ss.find(s=>s.name===name)?null:(ss.push({name,ex:[]}),ss[ss.length-1]);prev='';continue}
    m=l.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+(?:-\d+)?)\s*(s|seg|segs|segundos|min|minutos)?\s*(por lado|c\/lado|\/lado)?\.?$/i);
    if(m&&cur){let n=m[1];if(/^[a-záéíóúñ]/.test(n)&&prev)n=prev+' '+n;
      cur.ex.push({name:n,sets:+m[2],reps:m[3],side:!!m[5],unit:m[4]?(/^m/i.test(m[4])?'min':'s'):''});prev='';continue}
    m=l.match(/^cardio:?\s*(.+)$/i);
    if(m&&cur){cur.ex.push({name:'Cardio',note:m[1],sets:0});continue}
    prev=l;
  }
  return ss.filter(s=>s.ex.length);
}

async function pdfText(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const c=await(await pdf.getPage(p)).getTextContent(),rows={};
    c.items.forEach(i=>{const y=Math.round(i.transform[5]/4);(rows[y]=rows[y]||[]).push(i)});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>out.push(
      rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()));
  }
  return out.join('\n');
}

function ctx(){

  tags.push(['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][d.getDay()]);
  const mm=PF().lat>0?((m+5)%12)+1:m;
  tags.push(mm===12||mm<=2?'verano':mm<=5?'otoño':mm<=8?'invierno':'primavera');
  const w=wxNow();
  if(w){if(w.temp>=28)tags.push('calor');if(w.temp<=12)tags.push('frio');if(RAIN.includes(w.code))tags.push('lluvia');else if(w.code<=1&&w.day)tags.push('sol')}

function phrase(kind){
  const bank=PH[kind],tags=ctx().filter(t=>bank[t]);
  const custom=kind==='pr'?[]:(PF().customTxt||'').split('\n').map(x=>x.trim()).filter(Boolean);
  let key=null;
  if(tags.includes('cumple')&&Math.random()<0.85)key='cumple';
  else if(tags.includes('feriado')&&Math.random()<0.6)key='feriado';
  else if(tags.length&&Math.random()<0.7)key=pick(tags);
  const pool=key?bank[key]:bank.general.concat(custom);
  let p,i=0;do{p=pick(pool);i++}while(p===S.lastPh&&i<6&&pool.length>1);
  S.lastPh=p;return p.replace('{f}',holidayToday()||'hoy');
}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidaysAR(y){

    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||0.15;o.connect(g);g.connect(ac.destination);o.start();

function stats(){

  let streak=0,d=new Date(),k=weekRange(d)[0];

  while(wk[k]>=2){streak++;d.setDate(d.getDate()-7);k=weekRange(d)[0]}

  return{nW:S.hist.length,sets:S.hist.reduce((t,w)=>t+w.ex.reduce((u,e)=>u+(e.sets?e.sets.length:0),0),0),
    nPR:S.hist.reduce((t,w)=>t+(w.prs||0),0),early:S.hist.filter(w=>{const h=new Date(w.id).getHours();return h>=4&&h<9}).length,
    lost:L.length>1?Math.max(0,Math.floor((L[0].kg-last)*10)/10):0,streak,full:np>0&&Object.values(wk).some(n=>n>=np)?1:0,nWt:L.length,

}

  (S.plan?S.plan.sessions.map((s,si)=>`<div class="card"><h2>${esc(s.name)}</h2>`+s.ex.map((e,j)=>e.sets?`<div class="row" style="margin-top:8px">${demoId(e.name)?`<img class="th" loading="lazy" alt="" src="${IMG+demoId(e.name)}/0.jpg" onerror="this.remove()">`:''}<div class="mu" style="flex:1">${esc(e.name)} · ${e.sets} x ${esc(e.reps)}${e.side?' por lado':''}</div><button class="sec" style="padding:6px 10px" data-demo="p${si}-${j}">Ver</button></div><div id="dm-p${si}-${j}" class="demo" hidden>${demoHtml(e.name)}</div>`:`<div class="mu" style="margin-top:8px">${esc(e.name)}</div>`).join('')+`</div>`).join(''):'')+`<div class="card"><h2>Respaldo</h2><div class="mu">Guardá tu historial en un archivo y recuperalo si cambiás de celular o borrás los datos.</div><button class="full" id="exp">Exportar respaldo</button><button class="full sec" id="imp">Importar respaldo</button><button class="full sec" id="csv1">📊 Exportar entrenamientos (planilla CSV)</button><button class="full sec" id="csv2">📊 Exportar pesos y seguimiento (planilla CSV)</button><div class="mu" style="margin-top:8px">El respaldo no incluye las fotos: quedan en este celular.</div><input type="file" id="impf" accept=".json,application/json" style="display:none"><div id="bmsg" class="mu" style="margin-top:8px"></div></div><div class="card"><h2>📲 Instalar en otro celular</h2><div class="mu">Compartí la app con tu familia o amigos: cada uno tiene sus propios datos, su plan y su perfil.</div><button class="full" id="shr">📲 Mostrar código QR y enlace</button><button class="full sec" id="shrplan">📤 Enviar mi plan (texto) a otra persona</button></div>`;
}
function setPlan(t){
  const ss=parse(t),m=$('msg');
  if(!ss.length){m.textContent='No encontré ejercicios. Probá con el formato «Nombre 3 x 10», una sesión por bloque, y encabezados como «A | Piernas» o «Día 1».';return}
  S.plan={raw:t,sessions:ss};S.cur=null;save();render();
  $('msg').textContent='Listo: '+ss.length+' sesiones cargadas.';
}

async function doExport(){
  const m=$('bmsg');
  try{const dl=window.claude&&await window.claude.use('downloads');
    const data=JSON.stringify(S),fn='mi-entreno-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
    if(dl)await dl.save({filename:fn,data});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
    m.textContent='Respaldo listo.'}
  catch(e){m.textContent=e&&e.code==='declined'?'Cancelaste la descarga.':'No pude guardar el respaldo.'}
}
let lastView=null,navBack=false;
function render(){const chg=view!==lastView;lastView=view;renderInner();const ap=$('app');ap.className='';if(chg){void ap.offsetWidth;ap.className='pg'+(navBack?' bk':'')}navBack=false;wl();if(view==='prog')loadFotos()}
function renderInner(){
  $('app').innerHTML=(view==='home'?home():bb()+(view==='hoy'?hoy():view==='hist'?hist():view==='prog'?prog():plan()));
  $('nav').innerHTML=[['hoy','🏠','Hoy'],['hist','📋','Historial'],['prog','📈','Progreso'],['plan','⚙️','Ajustes']].map(([v,ic,n])=>`<button data-v="${v}" class="${view===v?'on':''}"><b>${ic}</b>${n}</button>`).join('');
}

  else if(b.id==='rn-save')saveRn();
  else if(b.id==='rn-cancel')closeRn();
  else if(d.rs)startRoutine(d.rs);

  else if(d.rren){const r=RUT().find(x=>String(x.id)===d.rren);if(r)openRn({id:r.id,ex:r.ex,name:r.name})}
  else if(d.recall)openRec();
  else if(b.id==='rm-close')closeRec();
  else if(b.id==='shr')openShare();
  else if(b.id==='shr-link')shareLink();
  else if(b.id==='shr-copy')copyText(appUrl(),'📋 Enlace copiado');
  else if(b.id==='shr-close')closeShare();
  else if(b.id==='shrplan')sharePlan();
  else if(b.id==='inst'){if(ipr){ipr.prompt();ipr.userChoice.finally(()=>{ipr=null;render()})}}
  else if(b.id==='ob-save')saveOb();
  else if(b.id==='ob-skip')closeOb(true);
  else if(b.id==='free')startFree();
  else if(b.id==='addex')openEx();
  else if(b.id==='ex-save')saveEx();
  else if(b.id==='ex-cancel')closeEx();
  else if(b.id==='xtra')openX();
  else if(d.xt){xSel=d.xt;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
  else if(b.id==='x-save')saveX();
  else if(b.id==='x-cancel')closeX();
  else if(d.xdel){if(confirm('¿Borrar esta actividad?')){S.extra=(S.extra||[]).filter(x=>String(x.id)!==d.xdel);save();render()}}
  else if(b.id==='sgopen')openSeg();
  else if(b.id==='sg-save')saveSeg();

  else if(d.sgdel){if(confirm('¿Borrar esta carga?')){S.seg=SEG().filter(x=>x.w!==d.sgdel);save();render()}}
  else if(b.id==='fcam')$('fph').click();

  else if(d.sug){const[a_,kg_]=d.sug.split('|');S.cur.sets[a_].forEach(x=>{if(!x.done)x.kg=String(kg_)});save();render()}
  else if(d.tm!==undefined){const i=+d.tm,e=curSes().ex[i],k=S.cur.sets[i].findIndex(x=>!x.done);if(k<0)toast('Ya completaste todas las series. Usá ＋ Serie para sumar otra.');else startTm(i,k,exSecs(e),e.name)}

document.addEventListener('input',e=>{
  const d=e.target.dataset;if(d.f&&S.cur){S.cur.sets[d.i][d.k][d.f]=e.target.value;save()}
  if(d.bk&&S.cur){S.cur[d.bk].min=e.target.value;save();upd()}
  if(d.n!==undefined&&S.cur){(S.cur.notes=S.cur.notes||{})[d.n]=e.target.value;save()}
  if(d.set){S[d.set]=+e.target.value||0;save()}
  if(d.wk&&S.cur){S.cur[{kcal:'wkc',hr:'whr',dur:'wdur'}[d.wk]]=e.target.value;save()}
  if(d.opt){OPT()[d.opt]=e.target.checked;save();if(d.opt==='wake')wl()}
  if(d.pf){PF()[d.pf]=(e.target.type==='number')?(+e.target.value||0):e.target.value;save();if(d.pf==='birth')render()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='wph'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';openW(f).catch(err=>{closeW();alert('No pude abrir la foto. Probá sacar otra o escribí el peso a mano.')});return}
  if(e.target.id==='cd-f'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';cardPick(f);return}
  if(e.target.id==='fph'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';addFoto(f);return}
  if(e.target.id==='fa'||e.target.id==='fb'){fshow();return}
  if(e.target.id==='pex'){S.pex=e.target.value;render();return}
  if(e.target.id==='impf'&&e.target.files[0]){
    try{const o=JSON.parse(await e.target.files[0].text());if(!o||!Array.isArray(o.hist))throw 0;
      if(!confirm('Esto reemplaza lo que hay ahora en la app. ¿Seguir?'))return;
      S=Object.assign({plan:null,cur:null,hist:[],week:1,bw:122,rest:90,wts:[],pf:{name:'',h:0,age:0,goalKg:0,goal:'bajar'},opt:{wake:true,sound:true,vib:true}},o);S.cur=null;save();render();$('bmsg').textContent='Respaldo importado.'}
    catch(err){$('bmsg').textContent='El archivo no parece un respaldo válido.'}
    return}
  if(e.target.id!=='pdf'||!e.target.files[0])return;
  $('msg').textContent='Leyendo PDF…';
  try{const t=await pdfText(e.target.files[0]);$('txt').value=t;setPlan(t)}
  catch(err){$('msg').textContent='No pude leer el PDF. Pegá el texto a mano.'}
});
