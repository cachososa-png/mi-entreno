<script>
const K='mi-entreno-v1';
let S={plan:null,cur:null,hist:[],week:1,bw:122,rest:90,wts:[],pf:{name:'',h:0,age:0,goalKg:0,goal:'bajar'},opt:{wake:true,sound:true,vib:true}},view='home';
const FOCO=['Retomar movimientos: priorizá la técnica y un esfuerzo cómodo. Registrá las cargas.','Consolidar técnica: mantené las cargas y terminá con 3-4 repeticiones de reserva.','Progresar gradualmente: subí un poco la carga solo si la técnica fue buena.','Evaluar y recuperar: revisá cargas y sensaciones. No fuerces aumentos.'];
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function parse(t){
  const ss=[];let cur=null,prev='';
  for(const raw of t.split('\n')){
    const l=raw.replace(/\s+/g,' ').trim();if(!l)continue;
    let m=l.match(/^([A-Z])\s*\|\s*(.+)$/)||l.match(/^((?:d[ií]a|sesi[oó]n|rutina)\s+\w+)\b\s*[:\-|]?\s*(.*)$/i);
    if(m){const name=(m[1]+' · '+m[2]).replace(/ · $/,'');
      cur=ss.find(s=>s.name===name)?null:(ss.push({name,ex:[]}),ss[ss.length-1]);prev='';continue}
    m=l.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+(?:-\d+)?)\s*(por lado|c\/lado|\/lado)?\.?$/i);
    if(m&&cur){let n=m[1];if(/^[a-záéíóúñ]/.test(n)&&prev)n=prev+' '+n;
      cur.ex.push({name:n,sets:+m[2],reps:m[3],side:!!m[4]});prev='';continue}
    m=l.match(/^cardio:?\s*(.+)$/i);
    if(m&&cur){cur.ex.push({name:'Cardio',note:m[1],sets:0});continue}
    prev=l;
  }
  return ss.filter(s=>s.ex.length);
}

async function pdfText(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const c=await(await pdf.getPage(p)).getTextContent(),rows={};
    c.items.forEach(i=>{const y=Math.round(i.transform[5]/4);(rows[y]=rows[y]||[]).push(i)});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>out.push(
      rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()));
  }
  return out.join('\n');
}

const DEMO=[
[/curl femoral.*sentado/,'Seated_Leg_Curl'],[/curl femoral|isquio/,'Lying_Leg_Curls'],

[/press.*(militar|hombro)/,'Dumbbell_Shoulder_Press'],
[/\bremo\b.*apoyado/,'Dumbbell_Incline_Row'],[/\bremo\b.*(polea|sentado)/,'Seated_Cable_Rows'],[/\bremo\b.*mancuerna/,'One-Arm_Dumbbell_Row'],[/\bremo\b/,'Bent_Over_Barbell_Row'],
[/jalon/,'Wide-Grip_Lat_Pulldown'],[/dominada/,'Pullups'],
[/pallof/,'Pallof_Press'],[/dead bug/,'Dead_Bug'],[/plancha/,'Plank'],[/abdominal|crunch/,'Crunches'],
[/sentadilla.*(banco|cajon)/,'Dumbbell_Squat_To_A_Bench'],[/goblet/,'Goblet_Squat'],[/sentadilla/,'Barbell_Squat'],
[/hip thrust|empuje de cadera/,'Barbell_Hip_Thrust'],[/puente.*gluteo|glute bridge/,'Barbell_Glute_Bridge'],
[/elevaciones? lateral/,'Side_Lateral_Raise'],[/face pull/,'Face_Pull'],
[/rumano/,'Romanian_Deadlift'],[/peso muerto/,'Barbell_Deadlift'],
[/biceps/,'Dumbbell_Bicep_Curl'],[/triceps/,'Triceps_Pushdown'],
[/cuadriceps/,'Leg_Extensions'],[/zancada|estocada/,'Dumbbell_Lunges'],
[/apertura|vuelo|aleteo/,'Dumbbell_Flyes'],[/gemelo|pantorrilla/,'Standing_Calf_Raises'],[/flexion/,'Pushups'],
[/hiperextension|lumbar/,'Hyperextensions_Back_Extensions']];
const nz=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function demoId(name){const n=nz(name),m=DEMO.find(x=>x[0].test(n));return m?m[1]:null}
function demoHtml(name){
  const id=demoId(name),yt='https://www.youtube.com/results?search_query='+encodeURIComponent(name+' ejercicio técnica correcta');
  return (id?`<div class="imgs">${[0,1].map(k=>`<img loading="lazy" alt="${esc(name)} posición ${k+1}" src="${IMG+id}/${k}.jpg" onerror="this.style.display='none'">`).join('')}</div>`:`<div class="mu">No encontré imágenes para este ejercicio.</div>`)+`<a href="${yt}" target="_blank" rel="noopener">▶ Buscar video en YouTube</a><div class="mu" style="font-size:11px">Imágenes: free-exercise-db (dominio público)</div>`;
}
const MET={Caminata:3.5,Cinta:4,Bici:5.5,Escalera:7,Movilidad:2.5};
function kcalCur(){
  const c=S.cur,bw=+S.bw||0;if(!c||!bw)return 0;
  let n=0;Object.values(c.sets).forEach(a=>a.forEach(x=>{if(x.done)n++}));
  let k=3.5*bw*(n*2.5/60);
  [c.warm,c.card].forEach(b=>{if(b&&b.m&&+b.min)k+=(MET[b.m]||4)*bw*(+b.min/60)});
  return Math.round(k);
}

end:{

function ctx(){
  const d=new Date(),h=d.getHours(),m=d.getMonth()+1,tags=[];
  tags.push(h>=5&&h<12?'mañana':h<20&&h>=12?'tarde':'noche');
  tags.push(['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][d.getDay()]);
  const mm=PF().lat>0?((m+5)%12)+1:m;
  tags.push(mm===12||mm<=2?'verano':mm<=5?'otoño':mm<=8?'invierno':'primavera');
  const w=wxNow();
  if(w){if(w.temp>=28)tags.push('calor');if(w.temp<=12)tags.push('frio');if(RAIN.includes(w.code))tags.push('lluvia');else if(w.code<=1&&w.day)tags.push('sol')}

  if(last){const days=Math.round((new Date(ld(d))-new Date(last))/864e5);if(days===1)tags.push('racha');if(days>=5)tags.push('vuelta')}

}
function phrase(kind){
  const bank=PH[kind],tags=ctx().filter(t=>bank[t]);
  const custom=kind==='pr'?[]:(PF().customTxt||'').split('\n').map(x=>x.trim()).filter(Boolean);
  let key=null;
  if(tags.includes('cumple')&&Math.random()<0.85)key='cumple';
  else if(tags.includes('feriado')&&Math.random()<0.6)key='feriado';
  else if(tags.length&&Math.random()<0.7)key=pick(tags);
  const pool=key?bank[key]:bank.general.concat(custom);
  let p,i=0;do{p=pick(pool);i++}while(p===S.lastPh&&i<6&&pool.length>1);
  S.lastPh=p;return p.replace('{f}',holidayToday()||'hoy');
}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidaysAR(y){
  const E=easter(y),add=n=>{const d=new Date(E);d.setDate(d.getDate()+n);return d},out={};
  [[1,1,'Año Nuevo'],[3,24,'Día de la Memoria'],[4,2,'Día de Malvinas'],[5,1,'Día del Trabajador'],[5,25,'Revolución de Mayo'],[6,17,'Paso a la Inmortalidad de Güemes'],[6,20,'Día de la Bandera'],[7,9,'Día de la Independencia'],[8,17,'Paso a la Inmortalidad de San Martín'],[10,12,'Día del Respeto a la Diversidad Cultural'],[11,20,'Día de la Soberanía Nacional'],[12,8,'Inmaculada Concepción'],[12,25,'Navidad']].forEach(([m,d,n])=>out[m+'-'+d]=n);
  [[-48,'Carnaval'],[-47,'Carnaval'],[-2,'Viernes Santo']].forEach(([k,n])=>{const d=add(k);out[(d.getMonth()+1)+'-'+d.getDate()]=n});
  return out;
}

function popup(emoji,title,text,meta,btn,share){
  const old=document.querySelector('.pop');if(old)old.remove();
  const d=document.createElement('div');d.className='pop';
  d.innerHTML=`<div class="pc"><div class="pe">${emoji}</div><div class="pt">${esc(title)}</div><div class="pp">${esc(text)}</div>${meta?`<div class="mu pm">${esc(meta)}</div>`:''}<button class="full" id="popok">${esc(btn||'¡A entrenar!')}</button>${share&&navigator.share?'<button class="full sec" id="popsh">📤 Compartir</button>':''}</div>`;
  const close=()=>{d.classList.add('out');setTimeout(()=>d.remove(),260)};
  d.addEventListener('click',e=>{if(e.target.id==='popsh'){navigator.share({text:share}).catch(()=>{});return}if(e.target===d||e.target.id==='popok')close()});
  document.body.appendChild(d);if(!share)setTimeout(close,9000);
}

function tone(f,d,v){
  if(!OPT().sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||0.15;o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}
}
function weekRange(d){const x=new Date(d),dow=(x.getDay()+6)%7,a=new Date(x);a.setDate(x.getDate()-dow);const b=new Date(a);b.setDate(a.getDate()+6);return[ld(a),ld(b)]}
function weekStats(ref){

  const L=(S.wts||[]).slice().sort((p,q)=>p.d<q.d?-1:1),inW=L.filter(x=>x.d>=a&&x.d<=b),bef=L.filter(x=>x.d<a).pop();
  return{a,b,n:hs.length,planned:S.plan?S.plan.sessions.length:0,
    sets:hs.reduce((t,w)=>t+w.ex.reduce((u,e)=>u+(e.sets?e.sets.length:0),0),0),
    kc:hs.reduce((t,w)=>t+(w.kcalW||w.kcal||0),0),prs:hs.reduce((t,w)=>t+(w.prs||0),0),
    cardio:hs.reduce((t,w)=>t+w.ex.filter(e=>e.name==='Cardio').reduce((u,e)=>u+(+e.min||0),0),0),
    wEnd:inW.length?inW[inW.length-1].kg:null,wPrev:bef?bef.kg:null};
}

function stats(){
  const L=(S.wts||[]).slice().sort((p,q)=>p.d<q.d?-1:1),wk={};
  S.hist.forEach(w=>{const k=weekRange(new Date(w.date+'T12:00:00'))[0];wk[k]=(wk[k]||0)+1});
  let streak=0,d=new Date(),k=weekRange(d)[0];
  if(!(wk[k]>=2)){d.setDate(d.getDate()-7);k=weekRange(d)[0]}
  while(wk[k]>=2){streak++;d.setDate(d.getDate()-7);k=weekRange(d)[0]}
  const np=S.plan?S.plan.sessions.length:0,goal=PF().goalKg,last=L.length?L[L.length-1].kg:0;
  return{nW:S.hist.length,sets:S.hist.reduce((t,w)=>t+w.ex.reduce((u,e)=>u+(e.sets?e.sets.length:0),0),0),
    nPR:S.hist.reduce((t,w)=>t+(w.prs||0),0),early:S.hist.filter(w=>{const h=new Date(w.id).getHours();return h>=4&&h<9}).length,
    lost:L.length>1?Math.max(0,Math.floor((L[0].kg-last)*10)/10):0,streak,full:np>0&&Object.values(wk).some(n=>n>=np)?1:0,nWt:L.length,
    reached:(L.length&&goal&&((PF().goal==='bajar'&&last<=goal)||(PF().goal==='subir'&&last>=goal)))?1:0};
}

  return `<h1>Ajustes</h1>`+`<div class="card"><h2>👤 Mi perfil</h2><div class="row"><span style="flex:1">Nombre</span><input type="text" value="${esc(PF().name||'')}" data-pf="name" style="width:160px;font-size:18px"></div><div class="row"><span style="flex:1">Altura (cm)</span><input type="number" inputmode="numeric" value="${PF().h||''}" data-pf="h"></div><div class="row"><span style="flex:1">Fecha de nacimiento</span><input type="date" value="${esc(PF().birth||'')}" data-pf="birth" style="width:165px;font-size:16px"></div>${ageNote()}<div class="row"><span style="flex:1">Peso objetivo (kg)</span><input type="number" inputmode="decimal" value="${PF().goalKg||''}" data-pf="goalKg"></div><div class="row"><span style="flex:1">Mi objetivo</span><select data-pf="goal" style="width:160px">${[['bajar','Bajar de peso'],['mantener','Mantener'],['subir','Subir de peso']].map(([v,t])=>`<option value="${v}" ${PF().goal===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="mu" style="margin-top:10px">Mis frases motivadoras (una por línea, opcional)</div><textarea data-pf="customTxt" style="min-height:90px;font-size:16px;margin-top:6px">${esc(PF().customTxt||'')}</textarea>${PF().h&&S.bw?`<div class="mu" style="margin-top:8px">IMC: ${(S.bw/Math.pow(PF().h/100,2)).toFixed(1)}</div>`:''}</div><div class="card"><h2>📍 Mi ciudad (clima)</h2><div class="mu">${PF().city?'Actual: '+esc(PF().city):'Elegí tu ciudad para que las frases tengan en cuenta el clima.'}</div><div class="row"><input type="text" id="cty" placeholder="Ej: Pilar" style="width:auto;flex:1;font-size:18px"><button class="sec" id="ctyb">Buscar</button></div><div id="ctyr"></div></div><div class="card"><h2>⚙️ Preferencias</h2><div class="row"><span style="flex:1">Peso corporal (kg)</span><input type="number" inputmode="decimal" value="${S.bw||''}" data-set="bw"></div><div class="row"><span style="flex:1">Descanso entre series (seg)</span><input type="number" inputmode="numeric" value="${S.rest||90}" data-set="rest"></div><div class="row"><span style="flex:1">🔆 Mantener la pantalla encendida mientras entrenás</span><input type="checkbox" data-opt="wake" ${OPT().wake?'checked':''}></div><div class="row"><span style="flex:1">🔔 Sonido al terminar el descanso</span><input type="checkbox" data-opt="sound" ${OPT().sound?'checked':''}></div><div class="row"><span style="flex:1">📳 Vibración al terminar el descanso</span><input type="checkbox" data-opt="vib" ${OPT().vib?'checked':''}></div><div class="mu" style="margin-top:8px">El peso corporal se usa solo para estimar calorías.</div></div><h2 id="plansec" style="margin:22px 0 10px;font-size:20px">📄 Mi plan de entrenamiento</h2><div class="card"><div class="mu">Subí tu PDF o pegá el texto. Después de leerlo, revisá que las sesiones queden bien.</div>
  <input type="file" id="pdf" accept="application/pdf" class="full" style="margin-top:10px">
  <textarea id="txt" placeholder="A | Fuerza general&#10;Prensa de piernas 2 x 12-15&#10;Jalón al pecho 2 x 12&#10;Cardio: 10 min de bicicleta" style="margin-top:8px">${esc(S.plan?S.plan.raw:'')}</textarea>
  <button class="full" id="go">Interpretar plan</button><div id="msg" class="mu" style="margin-top:8px"></div></div>`+
  (S.plan?S.plan.sessions.map((s,si)=>`<div class="card"><h2>${esc(s.name)}</h2>`+s.ex.map((e,j)=>e.sets?`<div class="row" style="margin-top:8px">${demoId(e.name)?`<img class="th" loading="lazy" alt="" src="${IMG+demoId(e.name)}/0.jpg" onerror="this.remove()">`:''}<div class="mu" style="flex:1">${esc(e.name)} · ${e.sets} x ${esc(e.reps)}${e.side?' por lado':''}</div><button class="sec" style="padding:6px 10px" data-demo="p${si}-${j}">Ver</button></div><div id="dm-p${si}-${j}" class="demo" hidden>${demoHtml(e.name)}</div>`:`<div class="mu" style="margin-top:8px">${esc(e.name)}</div>`).join('')+`</div>`).join(''):'')+`<div class="card"><h2>Respaldo</h2><div class="mu">Guardá tu historial en un archivo y recuperalo si cambiás de celular o borrás los datos.</div><button class="full" id="exp">Exportar respaldo</button><button class="full sec" id="imp">Importar respaldo</button><input type="file" id="impf" accept=".json,application/json" style="display:none"><div id="bmsg" class="mu" style="margin-top:8px"></div></div>`;
}
function setPlan(t){
  const ss=parse(t),m=$('msg');
  if(!ss.length){m.textContent='No encontré ejercicios. Probá con el formato «Nombre 3 x 10», una sesión por bloque, y encabezados como «A | Piernas» o «Día 1».';return}
  S.plan={raw:t,sessions:ss};S.cur=null;save();render();
  $('msg').textContent='Listo: '+ss.length+' sesiones cargadas.';
}

async function doExport(){
  const m=$('bmsg');
  try{const dl=window.claude&&await window.claude.use('downloads');
    const data=JSON.stringify(S),fn='mi-entreno-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
    if(dl)await dl.save({filename:fn,data});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
    m.textContent='Respaldo listo.'}
  catch(e){m.textContent=e&&e.code==='declined'?'Cancelaste la descarga.':'No pude guardar el respaldo.'}
}
let lastView=null,navBack=false;
function render(){const chg=view!==lastView;lastView=view;renderInner();const ap=$('app');ap.className='';if(chg){void ap.offsetWidth;ap.className='pg'+(navBack?' bk':'')}navBack=false;wl()}
function renderInner(){
  $('app').innerHTML=(view==='home'?home():bb()+(view==='hoy'?hoy():view==='hist'?hist():view==='prog'?prog():plan()));
  $('nav').innerHTML=[['hoy','🏠','Hoy'],['hist','📋','Historial'],['prog','📈','Progreso'],['plan','⚙️','Ajustes']].map(([v,ic,n])=>`<button data-v="${v}" class="${view===v?'on':''}"><b>${ic}</b>${n}</button>`).join('');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v){go(d.v)}
  else if(d.back){back()}
  else if(d.wsum){weekPopup()}
  else if(d.gp){go('plan');setTimeout(()=>{const e=$('plansec');if(e)e.scrollIntoView()},60)}
  else if(b.id==='ctyb')searchCity();
  else if(d.cty!==undefined){const c=ctyList[+d.cty];if(c){const p=PF();p.city=c.name+(c.admin1?', '+c.admin1:'');p.lat=c.latitude;p.lon=c.longitude;p.cc=c.country_code||'';S.wx=null;S.hph=null;save();render();loadWx(true)}}
  else if(d.ph){S.hph={t:Date.now(),p:phrase('start')};save();render()}
  else if(d.add!==undefined){const a=S.cur.sets[d.add],l=a[a.length-1];a.push({kg:l?l.kg:'',reps:'',done:false});save();render()}
  else if(d.rm!==undefined){const a=S.cur.sets[d.rm];if(a.length>1&&!a[a.length-1].done){a.pop();save();render()}else toast('Solo se puede quitar una serie que no esté marcada')}
  else if(d.watch){S.cur.watch=true;save();b.closest('.card').remove()}
  else if(b.id==='wcam')$('wph').click();
  else if(b.id==='wread')readW();
  else if(b.id==='wsave')saveFromModal();
  else if(b.id==='wcancel')closeW();
  else if(b.id==='wman'){const v=parseFloat(String($('wkg').value).replace(',','.'));if(!(v>=20&&v<=400)){alert('Escribí un peso válido en kg');return}saveW(v,'')}
  else if(d.wdel){if(confirm('¿Borrar este peso?')){S.wts=S.wts.filter(w=>w.d!==d.wdel);save();render()}}
  else if(d.st){const[a_,k_,dl]=d.st.split('|');const x=S.cur.sets[a_][k_];x.kg=String(Math.max(0,Math.round(((+x.kg||0)+2.5*dl)*10)/10));b.parentNode.querySelector('[data-f="kg"]').value=x.kg;save()}
  else if(d.demo){const el=$('dm-'+d.demo);if(el)el.hidden=!el.hidden}
  else if(d.r!==undefined){if(+d.r)rl+=+d.r;else stopRest();showRest()}
  else if(b.id==='exp')doExport();
  else if(b.id==='imp')$('impf').click();
  else if(d.s!==undefined)start(+d.s);
  else if(d.d){const[i,k]=d.d.split('-');const x=S.cur.sets[i][k];x.done=!x.done;b.classList.toggle('on',x.done);save();if(x.done){rest(S.rest||90);checkPR(+i)}upd()}
  else if(d.b){const o=S.cur[d.b];o.done=!o.done;b.classList.toggle('on',o.done);save();upd()}
  else if(d.m){const[k,m]=d.m.split('|'),o=S.cur[k];o.m=o.m===m?'':m;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m.split('|')[1]===o.m));save();upd()}
  else if(d.w){S.week=Math.min(4,Math.max(1,S.week+ +d.w));save();render()}
  else if(d.x){if(confirm('¿Borrar este entrenamiento?')){S.hist=S.hist.filter(w=>w.id!=d.x);save();render()}}
  else if(b.id==='fin')finish();
  else if(b.id==='can'){if(confirm('¿Descartar este entrenamiento?')){stopRest();S.cur=null;save();render()}}
  else if(b.id==='go')setPlan($('txt').value);
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;if(d.f&&S.cur){S.cur.sets[d.i][d.k][d.f]=e.target.value;save()}
  if(d.bk&&S.cur){S.cur[d.bk].min=e.target.value;save();upd()}
  if(d.n!==undefined&&S.cur){(S.cur.notes=S.cur.notes||{})[d.n]=e.target.value;save()}
  if(d.set){S[d.set]=+e.target.value||0;save()}
  if(d.wk&&S.cur){S.cur[d.wk==='kcal'?'wkc':'whr']=e.target.value;save()}
  if(d.opt){OPT()[d.opt]=e.target.checked;save();if(d.opt==='wake')wl()}
  if(d.pf){PF()[d.pf]=(e.target.type==='number')?(+e.target.value||0):e.target.value;save();if(d.pf==='birth')render()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='wph'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';openW(f).catch(err=>{closeW();alert('No pude abrir la foto. Probá sacar otra o escribí el peso a mano.')});return}
  if(e.target.id==='pex'){S.pex=e.target.value;render();return}
  if(e.target.id==='impf'&&e.target.files[0]){
    try{const o=JSON.parse(await e.target.files[0].text());if(!o||!Array.isArray(o.hist))throw 0;
      if(!confirm('Esto reemplaza lo que hay ahora en la app. ¿Seguir?'))return;
      S=Object.assign({plan:null,cur:null,hist:[],week:1,bw:122,rest:90,wts:[],pf:{name:'',h:0,age:0,goalKg:0,goal:'bajar'},opt:{wake:true,sound:true,vib:true}},o);S.cur=null;save();render();$('bmsg').textContent='Respaldo importado.'}
    catch(err){$('bmsg').textContent='El archivo no parece un respaldo válido.'}
    return}
  if(e.target.id!=='pdf'||!e.target.files[0])return;
  $('msg').textContent='Leyendo PDF…';
  try{const t=await pdfText(e.target.files[0]);$('txt').value=t;setPlan(t)}
  catch(err){$('msg').textContent='No pude leer el PDF. Pegá el texto a mano.'}
});
